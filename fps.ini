; Xbox 360 FPS counter settings
; Copy to Hdd1:\PeerPressure\SideLoading\ next to fps_hello.xex. Read once when a game starts.
; Lines starting with ; are comments. If this file is missing, these defaults are used.

; Show the counter as soon as the game starts? 0 = off until the combo is held,
; 1 = start showing FPS.
enabled = 0

; Top-left corner of the panel, in 1280x720 screen space.
; 64,36 sits just inside the TV-safe area.
x = 64
y = 36

; Size: each font pixel becomes this many screen pixels (1-8).
; Extra lines (stats, temps) use one size smaller.
scale = 3

; Backing box opacity, 0-100. The console can only replace pixels, not blend them,
; so this is a dither: 50 = every other pixel black, 0 = numbers only, 100 = solid.
opacity = 50

; Text color as RRGGBB. White is tested; other colors are untested and may come out
; with red and blue swapped.
text_color = #FFFFFF

; Combo: hold these buttons together for hold_ms milliseconds to step to the next display:
;   off -> FPS -> + MIN/AVG -> + graph -> + temperatures -> off
; Names: A B X Y LB RB LS RS START BACK UP DOWN LEFT RIGHT
combo = LB+RB+DOWN
hold_ms = 500

; Which extras are steps in that cycle (1 = included, 0 = skipped).
; The game sets aside memory for the biggest step (FPS only: about 0.3 MB, everything at
; scale 3: about 1.8 MB). If a game cannot spare it, the cycle there is just off -> FPS.
; "MIN n AVG n": lowest and average FPS over the last 10 seconds.
show_stats = 1
; Frametime graph: one column per frame, newest on the right. Dotted lines mark
; 16.7 ms (60 FPS) and 33.3 ms (30 FPS); the top is 50 ms (20 FPS).
show_graph = 1
; CPU, GPU, RAM and motherboard temperatures in degrees C, updated every 2 seconds.
show_temps = 1
